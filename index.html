<body>
<div id="loading" style="min-height:100vh;background:#EDEAE2;display:flex;align-items:center;
  justify-content:center;flex-direction:column;gap:12px;font-family:Inter,sans-serif;">
  <div style="width:44px;height:44px;border-radius:10px;background:#487A4C;display:flex;
    align-items:center;justify-content:center;font-size:11px;font-weight:800;color:#fff;
    letter-spacing:-0.5px;">IQ</div>
  <div style="font-size:13px;color:#9C9080;">Načítám Goorn IQ Planner…</div>
</div>
<div id="root" style="display:none"></div>
<script>
window.onerror=function(msg,src,line,col,err){
  document.getElementById('loading').style.display='none';
  var r=document.getElementById('root');
  r.style.cssText='display:flex;align-items:center;justify-content:center;min-height:100vh;padding:24px';
  r.innerHTML='<div style="background:#FAF7F2;border-radius:12px;padding:24px;max-width:400px;'+
    'text-align:center"><div style="color:#B45252;font-weight:700;margin-bottom:8px">Chyba</div>'+
    '<div style="font-size:12px;color:#685E52;word-break:break-all">'+msg+'</div>'+
    '<button onclick="location.reload()" style="margin-top:14px;padding:8px 16px;'+
    'background:#487A4C;color:#fff;border:none;border-radius:7px;cursor:pointer">Obnovit</button></div>';
  return false;
};
</script>
